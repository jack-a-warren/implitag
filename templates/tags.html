{% extends 'base.html' %}

{% block title %}Tags{% endblock %}

{% block stylesheet %}
<link rel="stylesheet" href="{{ url_for('static', filename='tags.css') }}">
{% endblock %}

{% block content %}
<div class="content">
  <a href="{{ url_for('new_tag') }}" style="margin-bottom: 8px">New</a>
  <input type="text" name="tag-search" id="tag-search">

  <ul class="plain-list tag-index">
    {% for tag in tags %}
    <li class="tag">
      <a href="{{ url_for('edit_tag', tag_id=tag['tag_id']) }}">E</a>
      <a href="{{ url_for('search', q=tag['name']) }}">S</a>
      <a class="tag-link" href="{{ url_for('view_tag', tag_id=tag['tag_id']) }}">{{ tag['name'] }}</a>
    </li>
    {% endfor %}
  </ul>

  <script>
    var tag_links = document.querySelectorAll(".tag-link");
    var tag_search_box = document.querySelector("#tag-search");
    var all_tag_names = Array.from(tag_links).map((tag_link) => {
      return tag_link.innerHTML;
    });
    
    function update_list() {
      var search = tag_search_box.value.toLowerCase().trim();
      var search_terms = search.split(/\s+/);
      var matches = all_tag_names.filter((tag_name) => {
        for (let i = 0; i < search_terms.length; i++) {
          if (!(tag_name.includes(search_terms[i]))) {
            return false;
          }
        }

        return true;
      })

      document.querySelectorAll(".tag-index li").forEach((item) => {
        if (matches.includes(item.querySelector(".tag-link").innerHTML)) {
          item.style.display = "inline";
          console.log("shown");
        } else {
          item.style.display = "none";
          console.log("hidden");
        }
        console.log(item);
      })
    }

    tag_search_box.addEventListener("input", update_list);
  </script>
</div>
{% endblock %}
