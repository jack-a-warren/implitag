{% extends 'base.html' %}

{% block title %}Edit tag{% endblock %}

{% block stylesheet %}
<link rel="stylesheet" href="{{ url_for('static', filename='tag_edit.css') }}">
{% endblock %}

{% block content %}

{% set description = "" if tag.description == None else tag.description %}

<div>
  <form class="data-form" action="{{ url_for('update_tag', tag_id=tag.tag_id) }}" method="post">
    <label for="name">Name</label>
    <input type="text" name="name" value="{{ tag.name }}">
    <label for="description">Description (empty for none)</label>
    <textarea type="text" name="description" rows=10 cols=60>{{ description }}</textarea>
    <label for="implied_by">Implied by (separated with spaces)</label>
    <textarea type="text" name="implied_by" id="implied_by" rows=10 cols=60>{{ ' '.join(implied_by_names) }}</textarea>
    <label for="implies">Implies (separated with spaces)</label>
    <textarea type="text" name="implies" id="implies" rows=10 cols=60>{{ ' '.join(implies_names) }}</textarea>
    <input type="submit" value="Submit">
  </form>
  <script src="{{ url_for('static', filename='autocomplete.js') }}"></script>
  <script>
    var tags = [{% for tag in all_tags %}"{{ tag }}", {% endfor %}];
    autocomplete(document.getElementById("implied_by"), tags);
    autocomplete(document.getElementById("implies"), tags);
  </script>
</div> 
{% endblock %}
